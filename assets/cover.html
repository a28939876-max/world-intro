<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><style>
:root{--paper:#f4ecda;--card:#fbf6ea;--ink:#3b3127;--ink2:#6f6353;--coral:#e07a4e;--coral-soft:#f0c7b1;--line:#d8cbb2;}
*{box-sizing:border-box;margin:0;padding:0;}html,body{width:1200px;height:630px;overflow:hidden;}
body{font-family:"PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
 background:radial-gradient(circle at 14% 12%,rgba(224,122,78,.10),transparent 42%),radial-gradient(circle at 88% 90%,rgba(224,122,78,.07),transparent 46%),var(--paper);
 padding:74px 90px;display:flex;flex-direction:column;justify-content:center;position:relative;}
.tag{align-self:flex-start;font-size:23px;letter-spacing:.22em;color:var(--coral);font-weight:800;border:2px solid var(--coral-soft);border-radius:999px;padding:9px 26px;background:var(--card);}
h1{font-size:118px;font-weight:800;letter-spacing:-.02em;margin:30px 0 6px;line-height:1;}
h1 .dash{color:var(--coral);}
.tagline{font-size:40px;font-weight:700;color:var(--ink);margin-top:18px;}
.zh{font-size:30px;color:var(--coral);font-weight:800;letter-spacing:.04em;margin-left:14px;}
.verbs{display:flex;gap:0;align-items:center;margin-top:40px;}
.verbs .v{font-size:29px;font-weight:700;color:var(--ink2);}
.verbs .a{font-size:26px;color:var(--coral-soft);font-weight:800;padding:0 18px;}
.foot{position:absolute;left:90px;bottom:54px;font-size:24px;color:var(--ink2);}
.foot b{color:var(--coral);}
</style></head><body>
  <span class="tag">OPEN-SOURCE LAUNCH PIPELINE</span>
  <h1>world<span class="dash">-</span>intro</h1>
  <div class="tagline">Introduce your skill to the world.<span class="zh">行道于天下</span></div>
  <div class="verbs">
    <span class="v">found</span><span class="a">→</span>
    <span class="v">understood</span><span class="a">→</span>
    <span class="v">verified</span><span class="a">→</span>
    <span class="v">used</span><span class="a">→</span>
    <span class="v">improved upon</span>
  </div>
  <div class="foot">Decide if it's <b>worth it</b>, generalize it, prove it on real data, then ship &amp; get it seen.</div>
</body></html>
