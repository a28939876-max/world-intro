<!DOCTYPE html><html lang='zh-CN'><head><meta charset='utf-8'><style>
:root{--paper:#f4ecda;--card:#fbf6ea;--ink:#3b3127;--ink2:#6f6353;--coral:#e07a4e;--coral-soft:#f0c7b1;--line:#d8cbb2;--ok:#5a8f4e;--warn:#c2502f;}
*{box-sizing:border-box;margin:0;padding:0;}html,body{width:1080px;height:1440px;overflow:hidden;background:var(--paper);}
body{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
.card{width:1080px;height:1440px;padding:78px 72px;display:flex;flex-direction:column;position:relative;
 background:radial-gradient(circle at 15% 6%,rgba(224,122,78,.08),transparent 42%),radial-gradient(circle at 90% 95%,rgba(224,122,78,.06),transparent 46%),var(--paper);}
.tag{align-self:flex-start;font-size:25px;letter-spacing:.16em;color:var(--coral);font-weight:800;border:2px solid var(--coral-soft);border-radius:999px;padding:9px 26px;background:var(--card);}
.pager{position:absolute;top:82px;right:72px;font-size:26px;font-weight:800;color:var(--coral-soft);letter-spacing:.1em;}
h1{font-size:80px;line-height:1.18;font-weight:800;letter-spacing:-.01em;}
h1 .c{color:var(--coral);}
.sub{font-size:33px;line-height:1.55;color:var(--ink2);}
.spacer{flex:1;}
.brand{font-size:30px;font-weight:800;}.brand b{color:var(--coral);}
.url{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:26px;color:var(--ink2);}
.tags{font-size:28px;color:var(--coral);font-weight:700;line-height:1.6;}
.pain{display:flex;gap:22px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:28px 30px;margin-bottom:20px;}
.pain .q{font-size:46px;flex:none;line-height:1;}
.pain .t{font-size:33px;line-height:1.4;}
.step{display:flex;gap:22px;align-items:center;margin-bottom:26px;}
.step .k{width:60px;height:60px;flex:none;border-radius:50%;background:var(--coral);color:#fff;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.step .t{font-size:34px;line-height:1.35;}.step .t b{color:var(--coral);}
.verbs{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;}
.verb{font-size:30px;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--coral-soft);border-radius:999px;padding:10px 24px;}
.swipe{font-size:30px;color:var(--coral);font-weight:700;}
.callout{background:linear-gradient(180deg,#fbf6ea,#f7efdf);border:2px solid var(--coral-soft);border-left:12px solid var(--coral);border-radius:20px;padding:30px 34px;}
.callout p{font-size:34px;line-height:1.45;}.callout .c{color:var(--coral);font-weight:800;}
</style></head><body><div class="card"><span class="tag">剩下全交给它</span><div class="pager">3 / 4</div>
<div style="height:48px"></div>
<h1 style="font-size:60px">你说"<span class="c">帮我开源</span>"<br>剩下它来</h1>
<div style="height:36px"></div>
<div class="step"><div class="k">1</div><div class="t">真实搜赛道 → <b>该开 / 降级开 / 别开</b></div></div>
<div class="step"><div class="k">2</div><div class="t">从你的环境里<b>通用化</b>出来</div></div>
<div class="step"><div class="k">3</div><div class="t">拿<b>真实数据</b>跑一遍当案例</div></div>
<div class="step"><div class="k">4</div><div class="t">按反 AI 味把 README <b>写成人话</b></div></div>
<div class="step"><div class="k">5</div><div class="t">发布 + 多平台<b>推广</b></div></div>
<div class="spacer"></div>
<p class="sub">让你的 skill 被——</p>
<div class="verbs"><span class="verb">找到</span><span class="verb">理解</span><span class="verb">检验</span><span class="verb">使用</span><span class="verb">改进</span></div></div></body></html>
